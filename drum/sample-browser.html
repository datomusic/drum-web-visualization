<script type="module">
const samples = [
    { note: 30, color: '#FF0040', file: '30_kick_disco.wav' },
    { note: 31, color: '#FF0060', file: '31_kick_pattern.wav' },
    { note: 32, color: '#FF1010', file: '32_kick_big.wav' },
    { note: 33, color: '#FF1020', file: '33_kick_cr78.wav' },
    { note: 34, color: '#FF2040', file: '34_kick_808_long.wav' },
    { note: 35, color: '#FF2060', file: '35_kick_gabber.wav' },
    { note: 36, color: '#FF0000', file: '36_kick_808.wav' },
    { note: 37, color: '#FF0020', file: '37_kick_deep.wav' },
    { note: 38, color: '#0000FF', file: '38_snare_cr78.wav' },
    { note: 39, color: '#0028FF', file: '39_snare_808.wav' },
    { note: 40, color: '#0050FF', file: '40_snare_disco.wav' },
    { note: 41, color: '#0078FF', file: '41_snare_straw.wav' },
    { note: 42, color: '#1010FF', file: '42_snare_garage.wav' },
    { note: 43, color: '#1028FF', file: '43_snare_heimzap.wav' },
    { note: 44, color: '#2050FF', file: '44_snare_machine.wav' },
    { note: 45, color: '#3078FF', file: '45_snare_backbone.wav' },
    { note: 46, color: '#00FF00', file: '46_var_clap.wav' },
    { note: 47, color: '#00FF1E', file: '47_var_pop.wav' },
    { note: 48, color: '#00FF3C', file: '48_var_wood.wav' },
    { note: 49, color: '#00FF5A', file: '49_var_snap.wav' },
    { note: 50, color: '#10FF10', file: '50_var_sepp.wav' },
    { note: 51, color: '#10FF1E', file: '51_var_pow.wav' },
    { note: 52, color: '#10FF3C', file: '52_var_ah.wav' },
    { note: 53, color: '#20FF5A', file: '53_var_rim.wav' },
    { note: 54, color: '#FFFF00', file: '54_hat_cr78.wav' },
    { note: 55, color: '#FFE100', file: '55_hat_808.wav' },
    { note: 56, color: '#FFC300', file: '56_hat_maraca.wav' },
    { note: 57, color: '#FFA500', file: '57_hat_909_open.wav' },
    { note: 58, color: '#FFFF20', file: '58_hat_shaker.wav' },
    { note: 59, color: '#FFE120', file: '59_hat_electro.wav' },
    { note: 60, color: '#FFC320', file: '60_hat_second.wav' },
    { note: 61, color: '#FFA520', file: '61_hat_backbone.wav' },
];

const padBody = document.getElementById('pad-body');
const pad = document.getElementById('drumpad');
const prevBtn = document.getElementById('select-prev');
const nextBtn = document.getElementById('select-next');

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const buffers = new Array(samples.length).fill(null);

async function loadSample(index) {
    if (buffers[index]) return buffers[index];
    const response = await fetch(`samples/factory_kit/${samples[index].file}`);
    buffers[index] = await audioCtx.decodeAudioData(await response.arrayBuffer());
    return buffers[index];
}

let current = 0;
const masks = [0, 1, 2, 3].map(t => document.getElementById(`mask-track-${t}`));

function showColor(index) {
    padBody.style.fill = samples[index].color;
    const track = Math.floor(index / 8);
    masks.forEach((mask, t) => { mask.style.display = t === track ? '' : 'none'; });
}
showColor(current);

// Flash toward white on trigger (like the instrument): mix white into the
// selected color, then ease the mix back down linearly over 0.5s.
const FLASH_DURATION = 500;
const FLASH_WHITE_AMOUNT = 0.8;
let flashRaf = null;

function mixWithWhite(hex, amount) {
    const channels = [1, 3, 5].map(i => {
        const c = parseInt(hex.slice(i, i + 2), 16);
        return Math.round(c + (255 - c) * amount);
    });
    return `rgb(${channels.join(',')})`;
}

function flash() {
    cancelAnimationFrame(flashRaf);
    const color = samples[current].color;
    const start = performance.now();
    padBody.style.fill = mixWithWhite(color, FLASH_WHITE_AMOUNT);
    const frame = now => {
        const t = Math.min((now - start) / FLASH_DURATION, 1);
        padBody.style.fill = mixWithWhite(color, FLASH_WHITE_AMOUNT * (1 - t));
        if (t < 1) flashRaf = requestAnimationFrame(frame);
    };
    flashRaf = requestAnimationFrame(frame);
}

async function play(index) {
    flash();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    const buffer = await loadSample(index);
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(audioCtx.destination);
    source.start();
}

function select(step) {
    current = (current + step + samples.length) % samples.length;
    showColor(current);
    play(current);
}

pad.addEventListener('pointerdown', () => { showColor(current); play(current); });
prevBtn.addEventListener('pointerdown', () => select(-1));
nextBtn.addEventListener('pointerdown', () => select(1));
</script>
